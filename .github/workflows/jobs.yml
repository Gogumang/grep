name: 채용 공고 수집

on:
  schedule:
    # 매일 한국 시간 06:00 (UTC 21:00)
    - cron: '0 21 * * *'
  workflow_dispatch:

# 수집 결과(src/jobs/jobs.json)를 main에 커밋해야 해서 쓰기 권한이 필요하다.
permissions:
  contents: write

concurrency:
  group: collect-jobs
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # 수집 스크립트는 Node 내장 모듈만 쓴다 — 의존성 설치가 필요 없다.
      - name: 공고 수집
        run: bun scripts/fetchJobs.ts

      # 공고가 그대로면 snapshot.ts가 updatedAt을 유지해 파일이 똑같다 — 바뀐 게 없으면 커밋하지 않는다.
      # 새 공고의 본문 파일(src/jobs/body)은 아직 추적되지 않은 파일이라 git diff로는 안 잡혀 status로 본다.
      - name: 바뀌었으면 커밋
        run: |
          if [ -z "$(git status --porcelain -- src/jobs)" ]; then
            echo "공고 변경 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src/jobs
          git commit -m "chore: 채용 공고 갱신"
          git push

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    수달 얼굴. 워드마크의 셸 프롬프트(>_)를 얼굴에 옮겼다 — 왼쪽 눈이 >, 입이 _ 다.
    귀는 수달처럼 작게 옆에 붙인다. 16px 탭에서도 얼굴로 읽히게 획을 두껍게 둔다.
    채운 초록 얼굴 위 흰 획이라 밝은·어두운 탭 모두에서 보여 색은 한 벌(brand.500)만 둔다.
  -->
  <circle cx="6.4" cy="10.2" r="2.8" fill="#079743"/>
  <circle cx="25.6" cy="10.2" r="2.8" fill="#079743"/>
  <ellipse cx="16" cy="17.4" rx="13.4" ry="11.8" fill="#079743"/>
  <path d="M8.6 12.4l3.6 2.7-3.6 2.7" fill="none" stroke="#fff" stroke-width="2.2"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M13.4 23.2h5.2" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
</svg>

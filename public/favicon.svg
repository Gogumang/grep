<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20">
  <!--
    워드마크에 있던 셸 프롬프트를 그대로 옮겼다. viewBox와 획 두께가 같다.
    탭 배경은 브라우저 테마를 따르므로 색을 두 벌 둔다 — 라이트는 진한 초록,
    다크는 밝은 초록. 브랜드 토큰(brand.500 / brand.400)과 같은 값이다.
  -->
  <style>
    .stroke { stroke: #079743 }
    @media (prefers-color-scheme: dark) { .stroke { stroke: #09d25d } }
  </style>
  <path class="stroke" d="M3.8 5.4L9.4 10L3.8 14.6" fill="none" stroke-width="2.4"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path class="stroke" d="M11.4 15.4H16.6" fill="none" stroke-width="2.4"
        stroke-linecap="round" opacity="0.45"/>
</svg>
